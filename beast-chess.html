<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEAST CHESS — 7-Day Zero → Hero Training System</title>
<style>
/* ============================== THEME ============================== */
:root{
  --bg:#0b0f16; --bg2:#0f1521; --panel:#141c2b; --panel2:#182233; --line:#243149;
  --ink:#e9eef8; --muted:#9aa8c2; --gold:#f2c14e; --gold2:#ffd97a;
  --green:#4ade80; --green2:#22c55e; --red:#f87171; --blue:#60a5fa; --violet:#a78bfa;
  --sq-l:#e8ebf2; --sq-d:#7c8db0; --shadow:0 18px 40px rgba(0,0,0,.45);
  --r:16px; --r2:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, #182642 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #2a1e3d 0%, transparent 55%),
    var(--bg);
  color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0 0 .35em;line-height:1.2}
h2{font-size:26px;letter-spacing:-.4px}
h3{font-size:18px}
h4{font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.big{font-size:19px}
::selection{background:var(--gold);color:#12161f}

/* ============================== LAYOUT ============================== */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;
  background:rgba(11,15,22,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px;font-size:16px;flex:0 0 auto}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--gold),#e07b39);
  display:grid;place-items:center;font-size:19px;color:#1a1206;box-shadow:0 6px 18px rgba(240,180,60,.28)}
.brand small{display:block;font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;font-weight:600}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;
  order:3;flex:1 1 100%;padding-top:4px;border-top:1px solid rgba(255,255,255,.05)}
@media(min-width:1000px){#nav{order:0;flex:1 1 auto;padding-top:0;border-top:0}}
#nav::-webkit-scrollbar{display:none}
.navitem{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;font-size:12.8px;color:var(--muted);white-space:nowrap;border:1px solid transparent;flex:0 0 auto}
.navitem:hover{background:var(--panel);color:var(--ink)}
.navitem.active{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--ink);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
#dailyTip{max-width:290px;font-size:12.5px;color:var(--gold2);text-align:right}
@media(max-width:1520px){#dailyTip{display:none}}
@media(max-width:900px){.topactions .mode-pill{padding:6px 8px;font-size:11.5px}}
main{max-width:1360px;margin:0 auto;padding:22px 18px 90px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-h .sub{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:760px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1.35fr .95fr}
.g-3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.row.gap{gap:8px}.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
@media(max-width:1000px){.g-2{grid-template-columns:1fr}}

/* ============================== CARDS ============================== */
.card{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0)) , var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:0}
.card h3{display:flex;align-items:center;gap:8px}
.hero{background:linear-gradient(180deg,rgba(242,193,78,.07),rgba(255,255,255,0)),var(--panel)}
.hero-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.hero-top h3{font-size:22px;margin-top:4px}
.hero-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:700px){.hero-foot{grid-template-columns:1fr}}
.kpi{background:rgba(255,255,255,.03);border:1px dashed var(--line);border-radius:var(--r2);padding:12px}
.kpi ul{margin:.4em 0 0 1.1em;padding:0}
.kpi li{margin:.25em 0}
.mantra{background:linear-gradient(180deg,rgba(167,139,250,.09),rgba(255,255,255,0)),var(--panel)}
.mantra p{font-size:16.5px;font-style:italic;color:var(--gold2)}
.ring{--p:0;width:88px;height:88px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%), rgba(255,255,255,.09) 0);position:relative}
.ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel2)}
.ring span{position:relative;font-weight:800;font-size:16px}
.ring.sm{width:66px;height:66px}.ring.sm span{font-size:13px}
.progress{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:99px;transition:width .3s}

/* ============================== SESSIONS ============================== */
.sessions{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.session{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.025);border:1px solid var(--line);
  border-radius:var(--r2);padding:10px 12px}
.session.done{opacity:.62;border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.06)}
.sess-body{flex:1;display:flex;flex-direction:column;min-width:0}
.sess-body b{font-size:14.5px}
.sess-body span{font-size:12.5px;line-height:1.4}
.tick{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--green);font-weight:800;cursor:pointer}
.session.done .tick{background:var(--green2);border-color:var(--green2);color:#08130c}

/* ============================== BUTTONS ============================== */
.btn{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--ink);
  padding:9px 14px;border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{transform:translateY(-1px);border-color:#31425f}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%;margin-top:8px}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231705;border-color:#caa23e}
.btn.danger{background:linear-gradient(180deg,#f07f7f,#dc5a5a);color:#25090b;border-color:#c25151}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 12px;border-radius:99px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--panel2);color:var(--ink);border-color:#3a4c6d}
.puzzle-modes{display:flex;gap:8px;overflow:auto;padding-bottom:12px}
.qbtn{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:var(--r2);padding:11px 12px;cursor:pointer;color:var(--ink);font-size:22px;font-family:inherit}
.qbtn:hover{background:var(--panel2);border-color:#33445f;transform:translateY(-1px)}
.qbtn span{font-size:14px;font-weight:700;display:flex;flex-direction:column}
.qbtn small{font-weight:500;color:var(--muted);font-size:11.5px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:520px){.quick{grid-template-columns:1fr}}

/* ============================== STATS ============================== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.stats-grid.big{margin-bottom:16px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-size:17px}
.rank{color:var(--gold2)}
.badge{font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.good{border-color:rgba(74,222,128,.5);color:var(--green)}
.badge.warn{border-color:rgba(242,193,78,.5);color:var(--gold)}
.bullets{margin:.5em 0 .5em 1.1em;padding:0}
.bullets li{margin:.3em 0}
.bullets.good li::marker{color:var(--green)}
.bullets.bad li::marker{color:var(--red)}
.numlist{margin:.5em 0 .5em 1.2em;padding:0}
.numlist li{margin:.4em 0}
.lesson{color:var(--gold2)}

/* ============================== BOARD ============================== */
.play-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:16px;align-items:start}
.play-wrap>*{min-width:0}
.grid>*,.side-col,.board-col,.card{min-width:0}
@media(max-width:1000px){.play-wrap{grid-template-columns:minmax(0,1fr)}}
.board-card{padding:14px}
.board-wrap{position:relative;margin:0 auto;max-width:100%;aspect-ratio:1/1;width:100%}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:100%;height:100%;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06)}
.cell{position:relative;display:block;cursor:pointer;user-select:none;overflow:hidden}
.cell .pc{position:absolute;left:6%;top:6%;width:88%;height:88%}
.cell.lt{background:var(--sq-l)}
.cell.dk{background:var(--sq-d)}
.cell.lastmove:after{content:"";position:absolute;inset:0;background:rgba(242,193,78,.28)}
.cell.sel:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px rgba(74,222,128,.85);background:rgba(74,222,128,.16)}
.cell.incheck:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(248,113,113,.75),transparent 70%)}
.cell .pc{z-index:2;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.32))}
.cell .dot{position:absolute;width:26%;height:26%;left:37%;top:37%;border-radius:50%;background:rgba(20,30,20,.32);box-shadow:0 0 0 2px rgba(255,255,255,.25) inset;z-index:3}
.cell .dot.cap{width:80%;height:80%;left:10%;top:10%;background:transparent;border:4px solid rgba(200,60,60,.55);box-shadow:none}
.cell .cf{position:absolute;bottom:1px;right:3px;font-size:10px;color:rgba(20,25,35,.45);font-weight:700}
.cell .cr{position:absolute;top:1px;left:3px;font-size:10px;color:rgba(20,25,35,.45);font-weight:700}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.promo-layer{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,10,16,.72);z-index:20;border-radius:12px}
.promo-layer[hidden]{display:none!important}          /* THE BUG FIX: [hidden] must beat display:grid */
.cell{touch-action:none}
.cell.dragging .pc{opacity:.28}
.drag-ghost{position:fixed;width:62px;height:62px;z-index:999;pointer-events:none;transform:translate(-50%,-58%);
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.55))}
.hintline{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.cell.hintable{box-shadow:inset 0 0 0 3px rgba(96,165,250,.55)}
.cell.hintable .pc{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.cell.hintable+.cell.hintable{box-shadow:inset 0 0 0 3px rgba(96,165,250,.55)}
.wood{background:linear-gradient(180deg,#e8c07a,#d9a95a)}
.guide-bar{background:linear-gradient(90deg,rgba(96,165,250,.16),transparent);border:1px solid rgba(96,165,250,.4);
  border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.guide-bar b{color:var(--gold2)}
.coach-log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.coach-item{background:rgba(255,255,255,.03);border-left:3px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.coach-item.you{border-left-color:var(--green)}
.coach-item.them{border-left-color:var(--red)}
.coach-item.tip{border-left-color:var(--gold);background:rgba(242,193,78,.07)}
.coach-item b{color:var(--ink)}
.lesson{display:flex;gap:16px;flex-wrap:wrap}
.lesson .ltxt{flex:1 1 260px;min-width:0}
.lesson .lboard{width:min(360px,100%)}
.lchip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:99px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);font-family:inherit}
.lchip.on{border-color:var(--gold);color:var(--ink);background:rgba(242,193,78,.12)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.gloss div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.gloss b{color:var(--gold2)}
.topactions{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.mode-pill{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:99px;padding:6px 11px;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap}
.mode-pill.on{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
.hintline b{color:var(--green)}
.promo-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.promo-row{display:flex;gap:8px;margin-top:8px}
.promo-btn{width:56px;height:56px;background:var(--sq-l);border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:2px}
.board-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.status{font-size:13.5px;color:var(--ink)}
.coach-on{color:var(--green)}
.clock-row{display:flex;gap:10px;margin-bottom:10px}
.clock{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r2);padding:6px 10px;display:flex;flex-direction:column}
.clock.active{border-color:var(--gold);background:rgba(242,193,78,.08)}
.clock .clk{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.clock small{font-size:10.5px;letter-spacing:.14em;color:var(--muted)}

/* ============================== SIDE PANELS ============================== */
.side-col{display:flex;flex-direction:column;gap:16px}
.side-col .card{margin:0}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ctl select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px;border-radius:10px;font-family:inherit;font-size:14px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);line-height:1.35}
.chk input{margin-top:3px;accent-color:var(--gold)}
.movelist{max-height:280px;overflow:auto;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.16);border-radius:10px;padding:8px;border:1px solid var(--line)}
.mv-row{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;font-size:13.5px;padding:2px 4px;border-radius:6px}
.mv-row:nth-child(odd){background:rgba(255,255,255,.022)}
.mv-row .num{color:var(--muted)}
.mv{font-weight:600}
.coach-txt{font-size:13px}
.notes{background:rgba(0,0,0,.16);border:1px solid var(--line);border-radius:10px;padding:10px}
.note-line{font-size:14px}
.move-strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ms{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font-size:12px;padding:3px 7px;border-radius:7px;cursor:pointer;font-family:inherit}
.ms.on{background:var(--gold);color:#20160a;border-color:var(--gold)}
.line-group{margin-bottom:14px}
.lg-title{font-weight:700;margin-bottom:2px}
.line-btn{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);color:var(--ink);cursor:pointer;font-size:13px;font-family:inherit}
.line-btn.on{border-color:var(--gold);background:rgba(242,193,78,.1)}
.drill.passed{border-color:rgba(74,222,128,.4)}
.drill-board{max-width:260px;margin:10px auto}
.drill-board .board{box-shadow:0 8px 20px rgba(0,0,0,.4)}
details{margin:8px 0;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--gold2)}
.trap-board{max-width:280px;margin:6px auto 10px}
.trap-line{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px;background:rgba(0,0,0,.18);padding:8px;border-radius:9px;border:1px solid var(--line)}
.trap-line span{padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.04)}
.trap-line span.blunder{background:rgba(248,113,113,.25);color:#ffd7d7;font-weight:700}
.trap-line span.mate{background:rgba(74,222,128,.22);color:#d7ffe5;font-weight:700}
.trap-line.antidote span{background:rgba(96,165,250,.16)}
.day-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px}
.day-tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:9px 10px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--muted);cursor:pointer;font-family:inherit;font-size:13px;font-weight:700}
.day-tab small{font-size:10.5px;font-weight:600;color:var(--muted)}
.day-tab.on{color:var(--ink);border-color:var(--gold);background:rgba(242,193,78,.1)}
.day-tab.done small{color:var(--green)}
.goal{background:rgba(96,165,250,.08);border-left:3px solid var(--blue);padding:8px 10px;border-radius:8px}
.bigidea{background:rgba(242,193,78,.07);border-left:3px solid var(--gold);padding:8px 10px;border-radius:8px;font-size:14.5px}
.group-h{margin:22px 0 10px;color:var(--gold2);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.codex-card{text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.codex-card h4{font-size:14.5px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.codex-card .meta{font-size:11.5px;color:var(--muted)}
.codex-card.star{border-color:rgba(242,193,78,.45);background:linear-gradient(180deg,rgba(242,193,78,.09),transparent),var(--panel)}
.games{display:flex;flex-direction:column;gap:8px}
.game-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.res{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px}
.res.win{background:rgba(74,222,128,.2);color:var(--green)}
.res.loss{background:rgba(248,113,113,.18);color:var(--red)}
.res.draw{background:rgba(154,168,194,.18);color:var(--muted)}
.replay-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.replay-wrap>*{min-width:0}
@media(max-width:760px){.replay-wrap{grid-template-columns:1fr}}
.replay-side{display:flex;flex-direction:column;gap:10px}
.mini-btn{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);border-radius:10px;
  padding:8px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.mini-btn:hover{background:var(--panel2)}
.big-warn{font-size:16px;color:var(--gold2)}

/* ============================== OVERLAYS ============================== */
.modal-back{position:fixed;inset:0;background:rgba(4,7,12,.72);backdrop-filter:blur(4px);display:grid;place-items:center;
  padding:18px;z-index:100;opacity:0;transition:opacity .22s}
.modal-back.in{opacity:1}
.modal{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent),var(--panel);border:1px solid var(--line);border-radius:18px;
  max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateY(8px);transition:transform .22s}
.modal-back.in .modal{transform:none}
.modal.wide{max-width:820px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.modal-h h3{margin:0;font-size:19px}
.modal-b{padding:6px 18px 14px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 18px;flex-wrap:wrap}
.x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:340px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:10px 12px;
  font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateX(20px);transition:.25s}
.toast.in{opacity:1;transform:none}
.toast.good{border-left-color:var(--green)}
.toast.bad{border-left-color:var(--red)}
.toast.xp{border-left-color:var(--blue)}
.mantra-line{margin-top:14px;font-style:italic;color:var(--gold2)}

@media(max-width:640px){
  main{padding:14px 12px 80px}
  .page-h h2{font-size:21px}
  h2{font-size:21px}
  .btn{padding:9px 11px}
  .card{padding:13px}
}

.stamp-layer{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6;padding:6%}
.stamp-layer[hidden]{display:none!important}
.stamp{display:flex;flex-direction:column;align-items:center;gap:.35em;padding:.5em .9em;border-radius:.5em;
  transform:rotate(-7deg);text-align:center;max-width:96%;box-sizing:border-box;
  background:#0d1219;border:3px solid var(--gold);box-shadow:0 20px 48px rgba(0,0,0,.75),0 0 0 7px rgba(6,9,14,.55)}
.stamp b{letter-spacing:.05em;line-height:1.05;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.stamp span{line-height:1.3;color:#dbe6f8;font-weight:600;text-align:center}
.stamp.pop{animation:stampPop .42s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampPop{0%{transform:rotate(-7deg) scale(.5);opacity:0}60%{transform:rotate(-7deg) scale(1.08)}100%{transform:rotate(-7deg) scale(1);opacity:1}}
.stamp-layer.k-mate .stamp{border-color:var(--gold);background:#1c1202}
.stamp-layer.k-mate .stamp b{color:var(--gold)}
.stamp-layer.k-lose .stamp{border-color:#ff6b6b;background:#1c0d0d}
.stamp-layer.k-lose .stamp b{color:#ff8b8b}
.stamp-layer.k-check .stamp{padding:.35em .9em;border-width:3px;border-color:#ffb020;background:#241800}
.stamp-layer.k-check .stamp b{font-size:1.05em;color:#ffc861}
.stamp-layer.k-draw .stamp{border-color:#9fb0cc;background:#0f141c}
.stamp-layer.k-draw .stamp b{color:#dbe6f8}
.cell.mated{background:rgba(200,40,40,.55)!important;animation:matedPulse 1.1s ease-in-out infinite alternate}
.cell.mated .pc{filter:drop-shadow(0 0 8px rgba(255,80,80,.95))}
.cell.checked{background:rgba(255,170,0,.42)!important}
.cell.checked .pc{filter:drop-shadow(0 0 7px rgba(255,190,60,.9))}
@keyframes matedPulse{from{box-shadow:inset 0 0 0 3px rgba(255,70,70,.45)}to{box-shadow:inset 0 0 22px 6px rgba(255,70,70,.75)}}
.result-big{font-size:19px;font-weight:800;letter-spacing:.4px;margin-bottom:6px}
.result-sub{color:var(--muted);font-size:14px;margin-bottom:10px}

c4","Bc5","d3","Nf6"],"explanation":"Black defends the e5 pawn with the f-pawn — the single worst idea in the open game. White simply takes twice and starts checking: Nxe5! fxe5 Qh5+ Ke7 Qxe5+ Kf7 Bc4+ d5 Bxd5+ Kg6 and the black king is dragged out to the middle of the board while every white piece arrives with tempo. This attack plays itself — which is exactly why you must never do it.","antidote":"Defend e5 with a PIECE, never the f-pawn: ...Nc6 (best), ...d6 (Philidor), or ...Nf6 when it is safe. If your ...f6/...f5 is ever the only defence, you have already made an opening mistake — accept a slightly worse position and keep your king safe.","lesson":"The f-pawn is the guardian of your king. Do not use it as a defender in the opening.","trapSans":["e4","e5","Nf3","f6","Nxe5","fxe5","Qh5+","Ke7","Qxe5+","Kf7","Bc4+","d5","Bxd5+","Kg6","h4"],"trapFens":["rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1","rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq e6 0 2","rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2","rnbqkbnr/pppp2pp/5p2/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 0 3","rnbqkbnr/pppp2pp/5p2/4N3/4P3/8/PPPP1PPP/RNBQKB1R b KQkq - 0 3","rnbqkbnr/pppp2pp/8/4p3/4P3/8/PPPP1PPP/RNBQKB1R w KQkq - 0 4","rnbqkbnr/pppp2pp/8/4p2Q/4P3/8/PPPP1PPP/RNB1KB1R b KQkq - 1 4","rnbq1bnr/ppppk1pp/8/4p2Q/4P3/8/PPPP1PPP/RNB1KB1R w KQ - 2 5","rnbq1bnr/ppppk1pp/8/4Q3/4P3/8/PPPP1PPP/RNB1KB1R b KQ - 0 5","rnbq1bnr/pppp1kpp/8/4Q3/4P3/8/PPPP1PPP/RNB1KB1R w KQ - 1 6","rnbq1bnr/pppp1kpp/8/4Q3/2B1P3/8/PPPP1PPP/RNB1K2R b KQ - 2 6","rnbq1bnr/ppp2kpp/8/3pQ3/2B1P3/8/PPPP1PPP/RNB1K2R w KQ d6 0 7","rnbq1bnr/ppp2kpp/8/3BQ3/4P3/8/PPPP1PPP/RNB1K2R b KQ - 0 7","rnbq1bnr/ppp3pp/6k1/3BQ3/4P3/8/PPPP1PPP/RNB1K2R w KQ - 1 8","rnbq1bnr/ppp3pp/6k1/3BQ3/4P2P/8/PPPP1PP1/RNB1K2R b KQ h3 0 8"],"trapFinalMate":false,"antidoteSans":["e4","e5","Nf3","Nc6","Bc4","Bc5","d3","Nf6"],"antidoteFens":["rnbqkbnr/pppppppp/8/8/8/8/PPPPPPP       return;
    }
    el.innerHTML = game.log.map(function (e) { return '<div class="coach-item ' + e.type + '">' + e.text + '</div>'; }).join('');
  }

  function pushMove(m, byHuman) {
    var pre = game.st;
    var san = B.toSAN(game.st, m);
    var wasCap = !!m.captured;
    game.st = B.makeMove(game.st, m);
    game.sans.push(san); game.ucis.push(B.moveToUci(m)); game.fens.push(B.toFEN(game.st));
    game.lastMove = { from: m.from, to: m.to };
    game.moveCount++;
    if (game.clock) { game.clock[game.st.turn] += game.clock.inc; game.clock.last = Date.now(); }
    S.stats.moves++; save();
    sound(wasCap ? 'cap' : 'move');
    if (game.coach) coachNote(pre, m, byHuman);
    return san;
  }

  function engineMove() {
    if (game.over) return;
    game.thinking = true; paintPlay();
    setTimeout(function () {
      var t0 = Date.now();
      var m = B.bestMove(game.st, { level: game.level });
      var thinkTime = Math.max(280, Math.min(1600, Date.now() - t0));
      setTimeout(function () {
        if (!m) { game.thinking = false; computeStatus(); paintPlay(); return; }
        pushMove(m, false);
        game.thinking = false;
        computeStatus();
        if (!game.over) maybeCoach();
        paintPlay();
      }, Math.max(0, thinkTime - (Date.now() - t0)));
    }, 40);
  }

  /* ---- blunder guard ---- */
  function quickEval(st, ms) {
    var sc = B.rootScores(st, 2, { nodes: 0, stop: false, deadline: Date.now() + (ms || 350) });
    if (!sc.length) return null;
    sc.sort(function (a, b) { return b.score - a.score; });
    return { best: sc[0], all: sc };
  }
  function guardMove(m, cb) {
    if (!game.coach) return cb(true);
    var pre = quickEval(game.st, 420);
    var after = B.makeMove(game.st, m);
    var rep = quickEval(after, 420);
    if (!pre || !rep) return cb(true);
    var oppBest = rep.best.score;              // from opponent's view
    var ourScore = -oppBest;
    var drop = pre.best.score - ourScore;
    var mateIncoming = ourScore < -B.MATE + 200;
    if (drop < 180 && !mateIncoming) return cb(true);
    var danger = '';
    var m2 = rep.best.move;
    var line = B.toSAN(after, m2) + (B.toSAN(game.st, m) || '');
    danger = mateIncoming ? 'This move allows a <b>forced mate</b>.' :
      drop >= 500 ? 'This move loses material — about <b>' + (drop / 100).toFixed(1) + ' pawns</b>.' :
        'This move is a mistake — about <b>' + (drop / 100).toFixed(1) + ' pawns</b> worse than your best.';
    var counters = rep.all.slice(0, 3).map(function (x) { return B.toSAN(after, x.move); });
    modal({
      title: '<i class="i i-shield"></i> Blunder Guard',
      body: '<p class="big-warn">' + danger + '</p>' +
        '<p>The engine would answer with <b>' + counters.map(esc).join('</b> or <b>') + '</b>.</p>' +
        '<p class="muted">Run the checklist: what did his last move attack? Is something of mine hanging? What is his best reply to my move?</p>',
      buttons: [
        { label: 'Let me take it back', cls: 'primary', onClick: function () { cb(false); } },
        { label: 'Show me the danger', onClick: function () { var best = pre.best.move; game.hintArrow = [{ from: best.from, to: best.to, color: 'rgba(80,220,140,.9)' }]; paintPlay(); cb(false); toast('The best move is shown with a green arrow. Try again.', 'good'); } },
        { label: 'Play it anyway', cls: 'danger', onClick: function () { cb(true); } }
      ]
    });
  }

  function maybeCoach() {
    if (!game.coach || game.over) return;
    /* silent: coach messages shown in the side panel */
  }

  function tryHumanMove(from, to) {
    var list = B.legalMoves(game.st);
    var cands = list.filter(function (m) { return m.from === from && m.to === to; });
    if (!cands.length) return false;
    if (cands.length > 1) { // promotion
      board.promoPrompt(game.st.board[from][0], function (p) {
        var m = cands.filter(function (x) { return x.promo === p; })[0];
        afterPromo(m);
      });
      return true;
    }
    afterPromo(cands[0]);
    return true;
  }
  function afterPromo(m) {
    guardMove(m, function (ok) {
      if (!ok) { game.selected = null; game.targets = []; game.hintArrow = []; paintPlay(); return; }
      pushMove(m, true);
      game.selected = null; game.targets = []; game.over = false;
      game.hintArrow = [];
      if (game.guide && !game.over) guideAfterHuman(m);
      computeStatus();
      if (!game.over) { if (game.drill) drillAfterHuman(); else engineMove(); }
      paintPlay();
    });
  }

  function onSquare(sq) {
    if (game.over || game.thinking) return;
    if (game.st.turn !== game.humanColor) return;
    var p = game.st.board[sq];
    if (game.selected != null) {
      if (sq === game.selected) { game.selected = null; game.targets = []; paintPlay(); return; }
      if (game.targets.indexOf(sq) >= 0) { tryHumanMove(game.selected, sq); return; }
    }
    if (p && p[0] === game.humanColor) {
      game.selected = sq;
      game.targets = B.legalMoves(game.st).filter(function (m) { return m.from === sq; }).map(function (m) { return m.to; });
    } else { game.selected = null; game.targets = []; }
    paintPlay();
  }

  function paintPlay() {
    if (!board || currentView !== 'play') return;
    var checkSq = null;
    if (B.inCheck(game.st, game.st.turn)) checkSq = B.findKing(game.st, game.st.turn);
    board.state = game.st;
    board.dragColor = game.humanColor;
    board.flipped = game.humanColor === 'b';
    var showMe = [];
    if (S.settings.showMoves && !game.over && game.st.turn === game.humanColor && !game.thinking) {
      var lm = B.legalMoves(game.st), seen = {};
      lm.forEach(function (mv) { if (!seen[mv.from]) { seen[mv.from] = 1; showMe.push(mv.from); } });
    }
    board.hints = showMe;
    board.set({ state: game.st, selected: game.selected, targets: game.targets, lastMove: game.lastMove, checkSquare: checkSq, arrows: game.hintArrow || [], hints: showMe });
    paintResultSign();
    paintLog();
    guideTick();
    var ml = $('#moveList');
    if (ml) {
      var rows = '', i;
      for (i = 0; i < game.sans.length; i += 2) {
        rows += '<div class="mv-row"><span class="num">' + (i / 2 + 1) + '.</span><span class="mv">' + esc(game.sans[i]) + '</span>' +
          '<span class="mv">' + esc(game.sans[i + 1] || '') + '</span></div>';
      }
      ml.innerHTML = rows || '<p class="muted small">No moves yet.</p>';
      ml.scrollTop = ml.scrollHeight;
    }
    var statusEl = $('#gameStatus');
    if (statusEl) {
      if (game.over) statusEl.innerHTML = resultText(game.result);
      else if (game.thinking) statusEl.innerHTML = '<i class="i i-cpu"></i> <b>' + levelName(game.level) + '</b> is thinking…';
      else statusEl.innerHTML = (game.st.turn === game.humanColor ? '<i class="i i-dot"></i> <b>Your move</b>' : '<i class="i i-clock"></i> ' + levelName(game.level) + ' to move') +
        (game.coach ? ' · <span class="coach-on">Blunder Guard ON</span>' : '');
    }
  }
  function resultText(r) {
    if (!r) return '';
    if (r.reason === 'checkmate') return game.result && r.result === game.humanColor ? '<i class="i i-trophy"></i> Checkmate — you win!' : '<i class="i i-skull"></i> Checkmate — you lost.';
    if (r.result === 'draw') return '½–½ Draw — ' + r.reason;
    return r.result === game.humanColor ? '<i class="i i-trophy"></i> You win (' + r.reason + ')' : '<i class="i i-skull"></i> You lost (' + r.reason + ')';
  }

  function finishGame() {
    stopClock();
    if (game.drill) { finishDrill(); return; }
    var won = game.result.result === game.humanColor;
    var drew = game.result.result === 'draw';
    S.stats.games++;
    if (won) { S.stats.wins++; S.stats.winStreak++; S.stats.bestWinStreak = Math.max(S.stats.bestWinStreak, S.stats.winStreak); }
    else { S.stats.losses++; S.stats.winStreak = 0; }
    if (drew) S.stats.draws++;
    var rec = {
      id: 'g' + Date.now(), date: new Date().toISOString(), level: game.level, color: game.humanColor,
      result: game.result.result, reason: game.result.reason, sans: game.sans.slice(), ucis: game.ucis.slice(),
      fens: game.fens.slice(), plies: game.sans.length
    };
    S.games.unshift(rec); S.games = S.games.slice(0, 40);
    save();
    addXp(won ? 120 : drew ? 70 : 40, won ? 'game won vs ' + levelName(game.level) : (drew ? 'draw' : 'game finished — you still learned'));
    sound(won ? 'good' : 'bad');
    var isMate = game.result.reason === 'checkmate';
    var lastSan = game.sans.length ? game.sans[game.sans.length - 1] : '';
    var head = isMate
      ? (won ? '<i class="i i-trophy"></i> Checkmate — you win!' : '<i class="i i-skull"></i> Checkmate — the computer wins')
      : (won ? '<i class="i i-trophy"></i> Victory!' : drew ? '½–½ Draw' : '<i class="i i-skull"></i> Defeat');
    var mateLine = isMate
      ? '<p class="result-big">' + esc((lastSan || 'The last move') + ' was mate.') + '</p>' +
        '<p class="result-sub">The ' + (won ? 'computer\'s' : 'your') + ' king is attacked and has nowhere to go, nothing can block and nothing can capture the attacker. That is the whole object of chess.</p>'
      : '<p class="big">' + resultText(game.result) + '</p>';
    modal({
      title: head,
      wide: true,
      body: mateLine +
        '<p class="muted">' + game.sans.length + ' move' + (game.sans.length === 1 ? '' : 's') + ' played · opponent: ' + esc(levelName(game.level)) + ' · ' +
        (won ? '+120 XP' : drew ? '+70 XP' : '+40 XP') + '</p>' +
        '<p><b>Look at the board behind this box</b> — the mating square is marked in red. Then run the Blunder Report: that is where the real learning happens (Day 7 skill, use it every game).</p>',
      buttons: [
        (won ? { label: 'Next: harder opponent', onClick: function () { if (game.level < 5) { S.settings.level = game.level + 1; save(); } startPlayView(); } } : null),
        { label: 'Run Blunder Report', cls: won ? '' : 'primary', onClick: function () { analyzeCurrentGame(); } },
        { label: 'Rematch', onClick: function () { startPlayView(); } },
        { label: 'Close' }
      ].filter(Boolean)
    });
    paintPlay();
  }

  /* ---- analysis ---- */
  function analyzeGame(rec, onDone, progressEl) {
    var st = B.parseFEN(rec.fens[0]);
    var steps = [];
    var i = 0;
    function chunk() {
      var t0 = Date.now();
      while (i < rec.ucis.length && Date.now() - t0 < 220) {
        var m = B.uciToMove(st, rec.ucis[i]);
        if (!m) break;
        var pre = B.rootScores(st, 2, { nodes: 0, stop: false, deadline: Date.now() + 260 });
        if (!pre.length) break;
        pre.sort(function (a, b) { return b.score - a.score; });
        var bestScore = pre[0].score, bestMove = pre[0].move;
        var st2 = B.makeMove(st, m);
        var rep = B.rootScores(st2, 2, { nodes: 0, stop: false, deadline: Date.now() + 260 });
        rep.sort(function (a, b) { return b.score - a.score; });
        var afterScore = rep.length ? -rep[0].score : bestScore;
        var drop = bestScore - afterScore;
        steps.push({
          ply: i, san: rec.sans[i], best: B.toSAN(st, bestMove), bestUci: B.moveToUci(bestMove),
          drop: Math.max(0, drop), fenBefore: rec.fens[i], byHuman: (i % 2 === 0) === (rec.color === 'w'),
          scoreBefore: bestScore, scoreAfter: afterScore
        });
        st = st2;
        i++;
      }
      if (progressEl) progressEl.textContent = Math.round(i / rec.ucis.length * 100) + '%';
      if (i >= rec.ucis.length) { onDone(steps); } else setTimeout(chunk, 0);
    }
    chunk();
  }

  function analyzeCurrentGame() {
    var m = modal({
      title: '<i class="i i-search"></i> Blunder Report', wide: true, closable: true,
      body: '<p class="muted">Analysing every move of your ' + game.sans.length + '-move game… <span id="anProg">0%</span></p><div id="anBody"></div>'
    });
    var rec = { fens: game.fens.slice(), ucis: game.ucis.slice(), sans: game.sans.slice(), color: game.humanColor };
    analyzeGame(rec, function (steps) {
      var mine = steps.filter(function (s) { return s.byHuman; });
      var blunders = mine.filter(function (s) { return s.drop >= 500; });
      var mistakes = mine.filter(function (s) { return s.drop >= 250 && s.drop < 500; });
      var inacc = mine.filter(function (s) { return s.drop >= 100 && s.drop < 250; });
      var good = mine.filter(function (s) { return s.drop < 100; });
      var flagged = mine.filter(function (s) { return s.drop >= 100; });
      var worst = (flagged.length ? flagged : mine).slice().sort(function (a, b) { return b.drop - a.drop; }).slice(0, 5);
      var html = (flagged.length === 0 ? '<p class="big" style="color:var(--green)"><i class="i i-checkc"></i> No real errors found — that was a clean game. Keep this standard.</p>' : '') +
        '<div class="stats-grid">' + stat('Your moves', mine.length) + stat('<i class="i i-checkc"></i> Good', good.length) +
        stat('<i class="i i-alert"></i> Inaccuracies', inacc.length) + stat('<i class="i i-xc"></i> Mistakes', mistakes.length) + stat('<i class="i i-skull"></i> Blunders', blunders.length) + '</div>';
      var tips = [];
      if (blunders.length) tips.push('Your blunders almost always start with an unchecked capture or check. Use the 6-question checklist before every capture.');
      if (mine.some(function (s) { return /K|Q/.test(s.san) === false; })) tips.push('Look for the quiet best moves — the engine often prefers a developing move over grabbing a pawn.');
      tips.push('Rule: every time your opponent moves, ask "what did that attack?" before you look at your own ideas.');
      html += '<h4>' + (flagged.length ? 'Your worst moments' : 'Closest decisions') + '</h4><div class="row wrap">' + worst.map(function (s) {
        return '<button class="mini-btn" data-fen="' + esc(s.fenBefore) + '" data-best="' + esc(s.bestUci) + '">Move ' + (Math.floor(s.ply / 2) + 1) +
          ' — you played <b>' + esc(s.san) + '</b>, best was <b>' + esc(s.best) + '</b> (−' + (s.drop / 100).toFixed(1) + ')</button>';
      }).join('') + '</div>';
      html += '<h4>Coach says</h4><ul class="bullets">' + tips.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
      $('#anBody').innerHTML = html;
      $$('#anBody .mini-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          var fen = b.getAttribute('data-fen'), best = b.getAttribute('data-best');
          m.close();
          S.stats.blunders += blunders.length; save();
          nav('play');
          setTimeout(function () {
            newGame({ humanColor: 'w', fen: fen, level: game.level, coach: false, hint: false });
            var mv = B.uciToMove(game.st, best);
            var best2 = B.rootScores(game.st, 3, { nodes: 0, stop: false, deadline: Date.now() + 700 }).sort(function (a, b) { return b.score - a.score; })[0];
            game.hintArrow = [{ from: best2.move.from, to: best2.move.to, color: 'rgba(120,230,150,.9)' }];
            game.coach = false; game.over = true; // study mode: arrows only
            setTimeout(function () { game.over = false; game.humanColor = game.st.turn; paintPlay(); toast('Study position: the green arrow is the move you missed.', 'good', 4000); }, 60);
            paintPlay();
          }, 80);
        });
      });
    }, $('#anProg'));
  }

  function modeTitle(m) {

  function pieceCount(fen) { var n = 0, b = fen.split(' ')[0]; for (var i = 0; i < b.length; i++) if (/[a-zA-Z]/.test(b[i])) n++; return n; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  /* replay a SAN list from the start position -> verified sans + fens (client side) */
  function replayLine(sans) {
    var st = B.parseFEN(B.START_FEN), fens = [B.toFEN(st)], out = [];
    for (var i = 0; i < sans.length; i++) {
      var m = B.fromSAN(st, sans[i]);
      if (!m) break;
      out.push(B.toSAN(st, m));
      st = B.makeMove(st, m);
      fens.push(B.toFEN(st));
    }
    return { sans: out, fens: fens };
  }

  function pzLoad(i) {

  function pzSquare(sq) {
    if (!pz || pz.solvedThis || pz.showing) return;
    var st = pz.state;
    if (pz.selected != null) {
      if (sq === pz.selected) { pz.selected = null; pz.targets = []; pz.board.set({ selected: null, targets: [] }); return; }
      if (pz.targets.indexOf(sq) >= 0) { pzAttempt(pz.selected, sq); return; }
    }
    var pc = st.board[sq];
    if (pc && pc[0] === st.turn) {

  function pzAttempt(from, to) {
    var p = pz.p, st = pz.state;
    var want = p.solution[pz.solIndex];
    var cands = B.legalMoves(st).filter(function (m) { return m.from === from && m.to === to; });
    if (!cands.length) return;
    var mv = cands.length > 1 ? (cands.filter(function (c) { return B.moveToUci(c) === want; })[0] || cands[0]) : cands[0];
    var uci = B.moveToUci(mv);
    pz.attempts++;
    if (uci === want) {
      var san = B.toSAN(st, mv);
      pz.state = B.makeMove(st, mv);
      pz.selected = null; pz.targets = [];
      pz.board.set({ state: pz.state, selected: null, targets: [], lastMove: { from: from, to: to } });
      sound('good');
      var nextWant = p.solution[pz.solIndex + 1];
      if (!nextWant) { pzCorrect(); return; }
      pz.solIndex++;
      // opponent reply
      setHTML('#pzStatus', '<i class="i i-checkc"></i> <b>' + esc(san) + '</b> — correct! Now watch his reply…');
      setTimeout(function () {
        var opp = B.uciToMove(pz.state, nextWant) || (B.legalMoves(pz.state).sort(function (a, b) { return (b.captured ? 1 : 0) - (a.captured ? 1 : 0); })[0]);
        if (!opp) { pzCorrect(); return; }
        var oppSan = B.toSAN(pz.state, opp);
        var f = opp.from, t = opp.to;
        pz.state = B.makeMove(pz.state, opp);
        pz.solIndex++;
        pz.board.set({ state: pz.state, lastMove: { from: f, to: t }, selected: null, targets: [] });

  function pzHint(lite) {

  /* ============================ ENDGAME LAB ============================ */
  var DRILLS = [

  /* ============================ LEARN CHESS ============================ */
  var lp = { i: 0, state: null, selected: null, targets: [], board: null, moved: false };

  function vLearn(view, params) {
    var idx = Math.max(0, Math.min(LESSONS.length - 1, parseInt(params.lesson || '0', 10) || 0));
    if (params.lesson == null) idx = firstUnfinishedLesson();
    lp.i = idx;
    view.innerHTML = headerBar('Learn Chess', 'Never played before? Start at lesson 1, go in order, and drag the pieces around — you cannot break anything here.',
      '<button class="btn sm" id="btnGloss"><i class="i i-book"></i> Chess words</button>') +
      '<div class="puzzle-modes" id="lessonNav">' + LESSONS.map(function (l, i) {
        return '<button class="lchip' + (i === idx ? ' on' : '') + '" data-lesson="' + i + '">' + esc(l.title) + ((S.lessons || {})[l.id] ? ' <i class="i i-check"></i>' : '') + '</button>';
      }).join('') + '</div>' +
      '<div class="card"><div class="lesson">' +
      '<div class="ltxt"><span class="kicker">Lesson ' + (idx + 1) + ' of ' + LESSONS.length + '</span>' +
      '<h3>' + esc(LESSONS[idx].title) + '</h3><p>' + esc(LESSONS[idx].text) + '</p>' +
      '<div class="kpi"><span class="kicker">TRY IT</span><p>' + esc(LESSONS[idx].tryThis) + '</p></div>' +
      '<div class="row gap wrap" style="margin-top:12px">' +
      (idx > 0 ? '<button class="btn sm" id="lPrev"><i class="i i-chevL"></i> Previous</button>' : '') +
      (idx < LESSONS.length - 1 ? '<button class="btn sm primary" id="lNext">Next lesson <i class="i i-chevR"></i></button>' : '') +
      (isRead() ? '' : '<button class="btn sm" id="lDone"><i class="i i-check"></i> I have read this (+15 XP)</button>') +
      '<button class="btn sm" id="lGuided"><i class="i i-gamepad"></i> Start guided first game</button>' +
      '<button class="btn sm" id="lPractice"><i class="i i-puzzle"></i> 3 easy mate-in-1 puzzles</button>' +
      '</div>' +
      '<p class="muted small" style="margin-top:10px">Stuck on a word? Open <b>Chess words</b> above, or read the Playbook tab. Nothing here is timed.</p>' +
      '</div>' +
      '<div class="lboard"><div id="lessonHost"></div><p class="hintline" id="lessonHint">' +
      (LESSONS[idx].sandbox ? '<i class="i i-pointer"></i> Click a piece, then click a highlighted square (or drag the piece).' : 'This is just a reference board — read the text, then press the button.') +
      '</p></div>' +
      '</div></div>';

    var host = $('#lessonHost');
    lp.board = BD.create(host, {
      orientation: 'w', showCoords: true, freeDrag: !!LESSONS[idx].sandbox,
      interactive: !!LESSONS[idx].sandbox, onSquare: lessonSquare
    });
    lp.state = B.parseFEN(LESSONS[idx].fen);
    lp.selected = null; lp.targets = []; lp.moved = false;
    lp.mated = false;
    lp.board.markKing(null); lp.board.clearStamp();
    lp.board.set({ state: lp.state });
    lp.board.dragColor = 'w';

    /* A lesson only counts as read once the student engages with it (moves a
       piece in the sandbox or presses a button). Merely opening the page used
       to mark it read and award XP, which made the checkmarks — and the
       "resume where I left off" pointer — misleading. */
    function isRead() { return !!(S.lessons || {})[LESSONS[idx].id]; }
    function markRead() {
      var L = LESSONS[idx];
      if (isRead()) return;
      S.lessons = S.lessons || {}; S.lessons[L.id] = true; save();
      addXp(15, 'lesson read: ' + L.title);
      var d = $('#lDone'); if (d) d.remove();
    }
    lp.markRead = markRead;
    $$('#lessonNav .lchip', view).forEach(function (b) {
      b.addEventListener('click', function () { nav('learn', 'lesson=' + b.getAttribute('data-lesson')); });
    });
    $('#btnGloss').addEventListener('click', glossaryModal);
    if ($('#lNext')) $('#lNext').addEventListener('click', markRead);
    if ($('#lPrev')) $('#lPrev').addEventListener('click', function () { markRead(); nav('learn', 'lesson=' + (idx - 1)); });
    if ($('#lNext')) $('#lNext').addEventListener('click', function () { nav('learn', 'lesson=' + (idx + 1)); });
    if ($('#lDone')) $('#lDone').addEventListener('click', function () { markRead(); toast('+15 XP — lesson read: ' + LESSONS[idx].title, 'xp', 2000); });
    $('#lGuided').addEventListener('click', function () { markRead(); nav('play'); setTimeout(startGuidedGame, 250); });
    $('#lPractice').addEventListener('click', function () { markRead(); nav('puzzles', 'mode=mate1&n=3'); });
  }
  function firstUnfinishedLesson() {
    for (var i = 0; i < LESSONS.length; i++) if (!(S.lessons || {})[LESSONS[i].id]) return i;
    return 0;
  }
  function lessonSquare(sq) {
    var st = lp.state;
    if (!LESSONS[lp.i].sandbox) return;
    if (lp.selected != null && lp.targets.indexOf(sq) >= 0) { lessonMove(lp.selected, sq); return; }
    var p = st.board[sq];
    if (p) {
      var work = B.clone(st); work.turn = p[0];
      lp.selected = sq;
      lp.targets = B.legalMoves(work).filter(function (m) { return m.from === sq; }).map(function (m) { return m.to; });
      lp.board.set({ selected: sq, targets: lp.targets });
    } else { lp.selected = null; lp.targets = []; lp.board.set({ selected: null, targets: [] }); }
  }
  function lessonMove(from, to) {
    if (lp.markRead) lp.markRead();          /* touching the pieces = engagement */
    var st = lp.state, p = st.board[from];
    var work = B.clone(st); work.turn = p[0];
    var cands = B.legalMoves(work).filter(function (m) { return m.from === from && m.to === to; });
    if (!cands.length) return;
    var doMove = function (m) {
      var st2 = B.clone(st); st2.turn = p[0];
      var m2 = B.uciToMove(st2, B.moveToUci(m));
      var after = B.makeMove(st2, m2);
      after.turn = B.other(p[0]);          // free play: no strict turns
      lp.state = after; lp.selected = null; lp.targets = [];
      var san = B.toSAN(st2, m2);
      lp.board.set({ state: lp.state, selected: null, targets: [], lastMove: { from: from, to: to } });
      var msg = 'You played ' + san + '. ';
      if (m2.castle) msg += 'You just castled — the king is safe and the rook is active. Well done!';
      else if (m2.promo) msg += 'Promotion! Your pawn became a queen.';
      else if (m2.captured) msg += 'Nice — you captured the ' + pieceName(m2.captured) + '.';
      else msg += 'Keep experimenting — try the other pieces too.';

      /* --- did that move end the game? say so LOUDLY --- */

  /* =====================================================================
     PLAIN-ENGLISH LAYER — everything a total beginner needs
     ===================================================================== */
  var PNAME = { p: 'pawn', n: 'knight', b: 'bishop', r: 'rook', q: 'queen', k: 'king' };
  function pieceName(p) { return p ? (PNAME[p[1]] || 'piece') : 'piece'; }
  function colorName(c) { return c === 'w' ? 'White' : 'Black'; }
  function valOf(p) { return Math.round((B.VAL[p[1]] || 0) / 100 * 10) / 10; }

  /* does the piece standing on `from` attack `target`? (ignores its own other pieces) */
  function pieceAttacks(st, from, target) {
    var b = st.board, p = b[from];
    if (!p) return false;
    var color = p[0], copy = b.slice();
    for (var i = 0; i < 64; i++) if (copy[i] && copy[i][0] === color && i !== from) copy[i] = null;
    return B.attacked({ board: copy, castling: {} }, target, color);
  }
  /* is `sq` defended by `color`? (ignores the piece standing there) */
  function isDefended(st, sq, color) {
    var b = st.board.slice();
    b[sq] = null;
    return B.attacked({ board: b, castling: {} }, sq, color);
  }
  /* list of enemy pieces the piece on `from` attacks */
  function attackedTargets(st, from, victimColor) {
    var out = [];
    for (var i = 0; i < 64; i++) {
      var p = st.board[i];
      if (!p || p[0] !== victimColor) continue;
      if (pieceAttacks(st, from, i)) out.push({ sq: i, piece: p, defended: isDefended(st, i, victimColor) });
    }
    return out;
  }
  /* does `color` have a mate in one right now? returns the move or null */
  function mateThreat(st, color) {
    var work = B.clone(st); work.turn = color;
    var lm = B.legalMoves(work);
    for (var i = 0; i < lm.length; i++) {
      var u = B.makeInPlace(work, lm[i]);
      var mated = (B.legalMoves(work).length === 0) && B.inCheck(work, work.turn);
      B.unmakeInPlace(work, u);
      if (mated) return { move: lm[i], san: B.toSAN(st, lm[i]) };
    }
    return null;
  }

  /* -- "what did that move do?" in plain words -- */
  function describeMove(pre, m, mover) {
    var san = B.toSAN(pre, m);
    var piece = pre.board[m.from], t = piece[1];
    var bits = [];
    if (m.castle) bits.push('castles — the king is now safe behind its pawns and the rook joins in');
    if (m.captured) bits.push('captures the ' + pieceName(m.captured) + (valOf(m.captured) >= 3 ? ' (worth ' + valOf(m.captured) + ' pawns!)' : ''));
    if (m.promo) bits.push('promotes the pawn into a QUEEN — the strongest piece');
    var toName = B.sqName(m.to);
    if (t === 'p' && ['d4', 'e4', 'd5', 'e5'].indexOf(toName) >= 0 && !m.captured) bits.push('takes the center of the board');
    var after = B.makeMove(pre, m);
    var givesCheck = B.inCheck(after, after.turn);
    var mate = givesCheck && B.legalMoves(after).length === 0;
    if (mate) bits.push('CHECKMATE!');
    else if (givesCheck) bits.push('gives CHECK — their king is under attack');
    return { san: san, bits: bits, after: after, mate: mate };
  }

  /* -- "what is he threatening?" in plain words -- */
  function threatReport(st, humanColor) {
    var out = [];
    var opp = B.other(humanColor);
    var lastTo = null;
    /* mate threats first */
    var mt = mateThreat(st, opp);
    if (mt) out.push({ level: 'danger', text: 'Careful! The computer can mate you next move with ' + mt.san + '. You must stop it (block, capture, or move your king).' });
    /* undefended / attacked pieces of mine */
    for (var i = 0; i < 64; i++) {
      var p = st.board[i];
      if (!p || p[0] !== humanColor) continue;
      var attackers = [];
      for (var j = 0; j < 64; j++) {
        var q = st.board[j];
        if (!q || q[0] !== opp) continue;
        if (pieceAttacks(st, j, i)) attackers.push(j);
      }
      if (!attackers.length) continue;
      var defended = isDefended(st, i, humanColor);
      var lowest = attackers.map(function (a) { return st.board[a]; }).sort(function (a, b) { return valOf(a) - valOf(b); })[0];
      var cheapAttack = valOf(lowest) < valOf(p);
      if (!defended) out.push({ level: valOf(p) >= 3 ? 'danger' : 'warn', text: 'Your ' + pieceName(p) + ' on ' + B.sqName(i) + ' is under attack and nothing is defending it.' });
      else if (cheapAttack) out.push({ level: 'warn', text: 'Their ' + pieceName(lowest) + ' is attacking your ' + pieceName(p) + ' on ' + B.sqName(i) + ' (it is defended, so it is a fair trade, not a disaster).' });
    }
    return out.slice(0, 3);
  }

  /* -- "what should I do?" — a suggestion with a reason, in plain words -- */
  function suggestMove(st, humanColor) {
    var work = B.clone(st); work.turn = humanColor;
    var sc = B.rootScores(work, 3, { nodes: 0, stop: false, deadline: Date.now() + 1200 });
    if (!sc.length) return null;
    sc.sort(function (a, b) { return b.score - a.score; });
    var m = sc[0].move;
    var piece = work.board[m.from], t = piece[1];
    var after = B.makeMove(work, m);
    var why = [];
    if (m.castle) why.push('Castling puts your king in safety and brings your rook into the game — do it as early as you can.');
    if (m.captured) why.push('You win their ' + pieceName(m.captured) + ' (worth ' + valOf(m.captured) + ' pawns) — always check first that they cannot take something bigger back.');
    if (m.promo) why.push('Your pawn becomes a queen — that usually decides the game.');
    var toName = B.sqName(m.to);
    if (t === 'p' && ['d4', 'e4', 'd5', 'e5'].indexOf(toName) >= 0) why.push('It takes the center of the board, which is the best real estate for your pieces.');
    if (t === 'n' || t === 'b') {
      var centerish = (m.to >> 3) >= 2 && (m.to >> 3) <= 5 && (m.to & 7) >= 2 && (m.to & 7) <= 5;
      why.push(centerish ? 'It develops a piece toward the center — one new piece every move is the golden rule.' : 'It develops a piece and gets it out of the way so you can castle.');
    }
    if (t === 'q' && st.fullmove <= 8 && !m.captured) why.push('Careful: the queen is strong but a target. Usually knights and bishops should come out first.');
    var check = B.inCheck(after, after.turn);
    if (check) why.push('It gives check — their king must respond to it.');
    var atk = attackedTargets(after, m.to, B.other(humanColor));
    if (atk.length && !m.captured) why.push('It attacks their ' + pieceName(atk[0].piece) + ' on ' + B.sqName(atk[0].sq) + '.');
    if (t === 'k' && !m.castle) why.push('Moving the king — only do this when you have no better move, or to escape a check.');
    var defendsMyPiece = false;
    for (var i = 0; i < 64; i++) {
      var p = after.board[i];
      if (!p || p[0] !== humanColor) continue;
      if (isDefended(after, i, humanColor) && !isDefended(st, i, humanColor)) { defendsMyPiece = true; break; }
    }
    if (defendsMyPiece && !why.length) why.push('It defends a piece of yours that was in trouble.');
    if (!why.length) why.push('It quietly improves your position and keeps everything safe — that is often the best kind of move.');
    return { move: m, san: B.toSAN(work, m), why: why, score: sc[0].score };
  }

      fen: '4k3/8/8/8/8/8/8/R3K3 w - - 0 1', sandbox: true, freePieces: true
    },
    {
      id: 'mate', title: '8. Your first checkmate pattern: the back rank',
      text: 'Here the black king is trapped behind its own pawns. A rook or queen that reaches the far row gives checkmate — the king cannot move sideways (its own pawns are in the way), cannot capture, and nobody can block. This is the most common checkmate in real games.',
      tryThis: 'Move the white rook to the top (8th) row: a8. That is checkmate — the king has no escape.',
      fen: '6k1/5ppp/8/8/8/8/5PPP/R5K1 w - - 0 1', sandbox: true, freePieces: true
    },
    {
      id: 'special', title: '9. The two special moves: castling and promotion',
      text: 'CASTLING is a move where the king jumps two squares towards a rook and the rook hops to the other side of him. You may castling only if neither piece has moved yet, nothing is between them, and the king is not in check or passing through an attacked square. It is the fastest way to make your king safe — do it early!',
      tryThis: 'Drag your white king two squares to the right (e1 to g1). You just castled! You can also castle to the left, and with the black pieces too.',
      fen: 'r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1', sandbox: true, freePieces: true
    },
    {
      id: 'stalemate', title: '10. Draws: stalemate and repetition',
      text: 'Not every game ends with a win. If a player has NO legal move but is NOT in check, the game is a draw — that is STALEMATE (it is the classic way to throw away a winning position). Games are also drawn by threefold repetition, the 50-move rule, or if neither side has enough pieces to mate.',
      tryThis: 'Look at this position: the black king is not in check but has no legal move at all — the game is drawn. When you are winning, always leave the enemy king a square until you are ready to mate.',
      fen: '7k/5Q2/6K1/8/8/8/8/8 b - - 0 1', sandbox: true, freePieces: true
    },
    {
      id: 'plan', title: '11. How to play your first real game (the 4 golden rules)',
      text: 'You do not need to memorise anything to play well as a beginner. Follow these four rules every game: (1) Put a pawn in the center — e4 or d4 as White, e5 or d5 as Black. (2) Bring out your knights and bishops (never move the same piece twice). (3) CASTLE early — by move 6-10. (4) Before every move ask: "what did his last move attack?" That one question saves more games than any opening theory.',
      tryThis: 'Ready? Start a guided game below — the coach will tell you exactly what to do, one move at a time, and explain what the computer is doing back.',
      fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', sandbox: false
    }
  ];

  var GLOSSARY = [
    ['Check', 'Your king is being attacked. You must escape it right now.'],
    ['Checkmate', 'The king is attacked and cannot escape — the game ends and you win (or lose).'],
    ['Castling', 'A special king-and-rook move that makes your king safe. Move the king two squares toward a rook.'],
    ['Stalemate', 'The player to move has no legal move but is NOT in check — the game is a draw.'],
    ['Draw', 'Nobody wins: by stalemate, by repeating the same position three times, or after 50 moves with no pawn move or capture.'],
    ['Promotion', 'A pawn that reaches the last row becomes a queen (or rook, bishop, knight).'],
    ['Material', 'Your pieces counted up in pawns: pawn 1, knight 3, bishop 3, rook 5, queen 9.'],
    ['Development', 'Getting your knights and bishops off their starting squares and toward the center.'],
    ['The center', 'The four squares in the middle (d4, e4, d5, e5). Pieces there control more of the board.'],
    ['Tempo', 'One move. "Losing a tempo" means wasting a move.'],
    ['Fork', 'One piece attacking two enemy pieces at once — they can only save one.'],
    ['Pin', 'A piece cannot move because a more valuable piece is behind it (often the king).'],
    ['Skewer', 'Like a pin, but backwards: attack the big piece and win the smaller one behind it.'],
    ['Hanging', 'A piece that is undefended and can simply be captured.'],
    ['Trade', 'Both sides capture a piece of equal value.'],
    ['Sacrifice', 'Giving up material on purpose to get something better (an attack, or a win).'],
    ['Back rank', 'The first/last row where a castled king can get mated by a rook or queen.'],
    ['Double attack', 'Attacking two things with one move — the basis of almost every tactic.'],
    ['Passed pawn', 'A pawn with no enemy pawn left to stop it. Push it!'],
    ['Open file', 'A column with no pawns on it — perfect for your rooks.'],
    ['Zugzwang', 'Being forced to move when every move makes your position worse.'],
    ['Blunder', 'A really bad move that loses material or the game. It happens to everyone — the Blunder Guard exists to stop you.'],
    ['En passant', 'A rare pawn capture: if a pawn moves two squares past your pawn, you may capture it as if it had moved only one square (only immediately).'],
    ['Insufficient material', 'Neither player has enough pieces left to checkmate — the game is drawn.']
  ];
  function glossaryModal() {
    modal({
      title: '<i class="i i-book"></i> Chess words explained (plain English)', wide: true,
      body: '<p class="muted">Click any tab or the Playbook whenever you meet a word you do not know — or keep this open next to the board.</p>' +
        '<div class="gloss">' + GLOSSARY.map(function (g) { return '<div><b>' + esc(g[0]) + '</b><br>' + esc(g[1]) + '</div>'; }).join('') + '</div>',
      buttons: [{ label: 'Start a guided game', cls: 'primary', onClick: function () { nav('play'); setTimeout(startGuidedGame, 300); } }, { label: 'Close' }]
    });
  }

  /* ============================ PGN EXPORT ============================ */
  function pgnOf(g) {
    var res = g.result === 'w' ? '1-0' : g.result === 'b' ? '0-1' : '1/2-1/2';
    var date = (g.date || '').slice(0, 10).replace(/-/g, '.');
    var head = ['[Event "Beast Chess training game"]', '[Site "Beast Chess dashboard"]', '[Date "' + date + '"]',
      '[White "' + (g.color === 'w' ? 'You' : 'Engine ' + levelName(g.level)) + '"]',
      '[Black "' + (g.color === 'b' ? 'You' : 'Engine ' + levelName(g.level)) + '"]',
      '[Result "' + res + '"]'].join('\n');
    var out = '', line = '', fullmove = 1;
    for (var i = 0; i < g.sans.length; i++) {
      if (i % 2 === 0) line = fullmove + '. ' + g.sans[i];
      else { line += ' ' + g.sans[i]; out += (out ? ' ' : '') + line; fullmove++; line = ''; }
    }
    if (line) out += (out ? ' ' : '') + line;
    return head + '\n\n' + out + ' ' + res + '\n';
  }
  function copyText(txt, label) {
    function done() { toast('<i class="i i-clipboard"></i> ' + (label || 'Copied') + ' — paste it into lichess.org/paste or chess.com/analysis', 'good', 4200); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { fallback(); });
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { modal({ title: 'Copy this text', body: '<textarea style="width:100%;height:220px;background:#0d131f;color:#e9eef8;border:1px solid #243149;border-radius:10px;padding:10px">' + esc(txt) + '</textarea>' }); }
      ta.remove();
    }
  }

  /* ============================ BOOT ============================ */
  function boot() {
    var navEl = $('#nav');
    navEl.innerHTML = VIEWS.map(function (v) { return '<a class="navitem" data-v="' + v.id + '" href="#/' + v.id + '">' + v.icon + '<span>' + v.label + '</span></a>'; }).join('');
    /* clicks are handled in-app: hash links do not work inside sandboxed previews */
    $$('#nav .navitem').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); nav(a.getAttribute('data-v')); });
    });
    $('#dailyTip').innerHTML = DAILY_TIPS[new Date().getDate() % DAILY_TIPS.length];
    route = parseHash();
    /* deep links work on the web (play.html#learn); inside a sandboxed preview
       reading the hash can throw, so every access is guarded and we simply
       fall back to the Command Center. */
    try {
      var deep = (location.hash || '').replace(/^#\/?/, '') || (location.search || '').replace(/^\?v=/, '');
      if (deep) { var qs = ''; var qi = deep.indexOf('?'); if (qi >= 0) { qs = deep.slice(qi + 1); deep = deep.slice(0, qi); }
        var known = VIEWS.some(function (v) { return v.id === deep; });
        if (known) { route = { view: deep, params: parseQs(qs) }; }
      }
    } catch (e) { }
    setHash(route.view, '');
    render();
    bumpStreak();
    updateModePill();
    var hb = $('#helpBtn');
    if (hb) hb.addEventListener('click', howToPlayModal);
    var mp = $('#modePill');
    if (mp) mp.addEventListener('click', function () { applyBeginnerMode(!S.settings.beginner); });
    if (!S.settings.onboarded) setTimeout(welcomeWizard, 600);
  }
  var DAILY_TIPS = [
    'Before every move: <b>what did his last move attack?</b>',
    'Castle by move 10. Every game. No exceptions.',
    'When you are winning: trade pieces, not pawns.',
    'A knight on the rim is dim — centralize it.',
    'Never play f3/f6 with your king behind it unless you must.',
    'Count attackers vs defenders before every capture.',
    'If you see a good move, look for a better one.',
    'Nothing is free in the opening — calculate the checks first.',
    'Rook behind the passed pawn. Always.',
    'The player who recaptures last usually wins — count the sequence to the end.',
    'Time trouble: play simple, safe moves. Let the clock beat him.',
    'Checks, captures, threats — in that order, every move.'
  ];
  /* ---- debug hook (also handy for power users in the console) ---- */
  window.__beast = {
    get pz() { return pz; }, get game() { return game; }, get op() { return op; },
    state: function () { return S; }, nav: nav, solve: function (uci) {
      if (!pz) return 'no puzzle session';
      var m = B.uciToMove(pz.state, uci); if (!m) return 'illegal';
      pzAttempt(m.from, m.to); return 'ok';
    }, engineMove: function () { engineMove(); }, newGame: function (o) { newGame(o); },
    startGuided: function () { startGuidedGame(); }, guided: function () { return game && game.guide; },
    setPosition: function (fen, color) {
      game.st = B.parseFEN(fen);
      game.humanColor = color || game.st.turn;
      game.over = false; game.result = null; game.sans = []; game.ucis = []; game.fens = [fen];
      game.selected = null; game.targets = []; game.lastMove = null; game.hintArrow = []; game.thinking = false;
      if (game.guide) game.guide = { step: 0, done: false };
      paintPlay();
      return 'ok';
    },
    stamp: function () { var e = document.querySelector('.stamp b'); return e ? e.textContent : null; },
    kings: function () { return game.st.board.filter(function (p) { return p && p[1].toLowerCase() === 'k'; }).length; },
    suggest: function () { return suggestMove(game.st, game.humanColor); }
  };
  boot();
})();

</script>
